name: Deploy personal site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      section:
        type: string
        default: articles
      source_repository:
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_SECTION: ${{ inputs.section || 'articles' }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
